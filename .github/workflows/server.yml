name: server

on:
  push:
    paths:
      - "server/**"
      - "core/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "core/**"
      - ".github/workflows/server.yml"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build core (Debug)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S core -B build -A x64
            cmake --build build --config Debug --parallel
          else
            cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug
            cmake --build build --parallel
          fi
      - name: Install
        run: npm ci
        working-directory: server
      - name: Lint
        run: npm run lint
        working-directory: server
      - name: Audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - name: Check ps1 UTF-8 BOM
        # server/assets/*.ps1 必须 UTF-8 带 BOM（见 .gitattributes）；文件内容与
        # 平台无关，仅在 Ubuntu 腿跑一次即可
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for f in server/assets/*.ps1; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
              echo "::error file=$f::missing UTF-8 BOM (EF BB BF)"
              exit 1
            fi
          done
          echo "All server/assets/*.ps1 files carry a UTF-8 BOM."
      - name: Build
        run: npm run build
        working-directory: server
      - name: Test
        run: npm test
        working-directory: server
        env:
          # 让依赖真实 owc-exec 的测例（core-client / core-tcp / stage3-e2e / web-e2e）
          # 直接定位到上一步构建出的 Debug 二进制；缺失的仍由 skipIf 跳过
          OWC_CORE_PATH: ${{ runner.workspace }}/openwebcode/build/${{ runner.os == 'Windows' && 'Debug/owc-exec.exe' || 'owc-exec' }}
      - name: Coverage (non-blocking)
        continue-on-error: true
        run: npm run test:coverage
        working-directory: server
        env:
          OWC_CORE_PATH: ${{ runner.workspace }}/openwebcode/build/${{ runner.os == 'Windows' && 'Debug/owc-exec.exe' || 'owc-exec' }}
      - name: Upload coverage
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage-${{ matrix.os }}
          path: server/coverage/
          if-no-files-found: ignore
