name: docker

# 构建多架构 Docker 镜像并发布到 GitHub Container Registry（ghcr.io/snnh/openwebcode）。
# 触发：
#   - 推送 v* tag（与 release.yml 同源）：构建该 tag 的源码树，标签 v<版本>
#     （稳定版额外推 latest）
#   - 手动 workflow_dispatch：
#       输入 tag（如 v1.7.3）→ 构建该 tag 的源码树；
#       留空 → 构建当前分支，版本取 server/package.json（与 release 版本一致）
# 与 release.yml 解耦：镜像发布失败不阻断 GitHub Release（反之亦然）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的版本 tag（形如 vX.Y.Z；留空则构建当前分支，版本取 server/package.json）"
        required: false
        type: string

concurrency:
  group: docker-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/snnh/openwebcode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve tag and version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            # 手动指定 tag：切到该 tag 的源码树再构建
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
            git fetch --depth=1 "origin" "refs/tags/${TAG}:refs/tags/${TAG}"
            git checkout --detach "$TAG"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            # 手动触发未指定 tag：构建当前分支，版本取 server/package.json
            TAG="${{ github.ref_name }}"
            VERSION="$(node -p "require('./server/package.json').version")"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *)
              echo "::error::非法版本号（应为 vX.Y.Z 或 vX.Y.Z-<后缀>）: $TAG"
              exit 1
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "本次构建 tag=$TAG 版本=$VERSION"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # 逗号分隔单行输出：build-push-action 的 tags 输入按逗号/换行拆分
          TAGS="${{ env.IMAGE }}:v${{ env.VERSION }}"
          case "${{ env.VERSION }}" in
            *-*) echo "预发布版本，仅打 v${{ env.VERSION }} 标签" ;;
            *) TAGS="${TAGS},${{ env.IMAGE }}:latest" ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
