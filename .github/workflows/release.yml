name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（形如 v0.1.0；tag 不存在时基于当前提交创建）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # bundled Node 20 运行时的具体版本（nodejs.org 发行包），升级时只改这个常量
  NODE_DIST_VERSION: "20.19.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build server
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm ci
          npm run build
      - name: Build core (Debug, for tests)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S core -B build-debug -A x64
          cmake --build build-debug --config Debug --parallel
      - name: Test server
        shell: bash
        env:
          OWC_CORE_PATH: ${{ runner.workspace }}/openwebcode/build-debug/Debug/owc-exec.exe
        run: |
          set -euo pipefail
          cd server
          npm test
      - name: Build web
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
      - name: Test web
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm test
      - name: Prune dev deps for staging
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm prune --omit=dev
      - name: Build core (Release)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S core -B build -A x64 -DCPACK_PACKAGE_VERSION="$VERSION"
          cmake --build build --config Release --target owc-exec
      - name: Stage runtime into build/stage
        shell: bash
        run: |
          set -euo pipefail
          # staging 契约见 core/CMakeLists.txt 末尾注释
          mkdir -p build/stage/bin build/stage/server build/stage/web build/stage/node
          cp build/Release/owc-exec.exe build/stage/bin/
          cp -r server/dist server/package.json server/node_modules server/assets build/stage/server/
          cp -r web/dist build/stage/web/
          curl -fsSLo node.zip "https://nodejs.org/dist/v${NODE_DIST_VERSION}/node-v${NODE_DIST_VERSION}-win-x64.zip"
          # Git for Windows 的 tar 在部分 runner 镜像中只支持 tar 流，不能解 zip；
          # 使用系统 PowerShell 的 Expand-Archive，避免把 ZIP 误判为 tar。
          pwsh -NoLogo -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'node.zip' -DestinationPath '.' -Force"
          cp "node-v${NODE_DIST_VERSION}-win-x64/node.exe" build/stage/node/
          test -f build/stage/node/node.exe
          # .cmd 需要 CRLF：先去已有 \r 再统一加（与 checkout 的 EOL 配置无关）
          sed 's/\r$//' packaging/owc.cmd | sed 's/$/\r/' > build/stage/bin/owc.cmd
          test -f build/stage/bin/owc-exec.exe
      - name: Ensure WiX toolset
        shell: bash
        run: |
          if command -v candle.exe >/dev/null 2>&1 || [ -n "${WIX:-}" ]; then
            echo "WiX already available"
            exit 0
          fi
          choco install wixtoolset --no-progress
          echo 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"
      - name: Pack MSI (CPack WIX)
        shell: bash
        run: |
          set -euo pipefail
          if ! cpack --config build/CPackConfig.cmake -G WIX -C Release; then
            find _CPack_Packages -name wix.log -print -exec cat '{}' \; || true
            exit 1
          fi
      - name: Upload MSI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          files: build/openwebcode-${{ env.VERSION }}-windows-x64.msi

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build server
        run: |
          set -euo pipefail
          cd server
          npm ci
          npm run build
      - name: Build core (Debug, for tests)
        run: |
          set -euo pipefail
          cmake -S core -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug --parallel
      - name: Test server
        env:
          OWC_CORE_PATH: ${{ runner.workspace }}/openwebcode/build-debug/owc-exec
        run: |
          set -euo pipefail
          cd server
          npm test
      - name: Build web
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
      - name: Test web
        run: |
          set -euo pipefail
          cd web
          npm test
      - name: Prune dev deps for staging
        run: |
          set -euo pipefail
          cd server
          npm prune --omit=dev
      - name: Build core (Release)
        run: |
          set -euo pipefail
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Release -DCPACK_PACKAGE_VERSION="$VERSION"
          cmake --build build --target owc-exec --parallel
      - name: Stage runtime into build/stage
        run: |
          set -euo pipefail
          # staging 契约见 core/CMakeLists.txt 末尾注释
          mkdir -p build/stage/bin build/stage/server build/stage/web build/stage/node
          cp build/owc-exec build/stage/bin/
          cp -r server/dist server/package.json server/node_modules server/assets build/stage/server/
          cp -r web/dist build/stage/web/
          curl -fsSLo node.tar.gz "https://nodejs.org/dist/v${NODE_DIST_VERSION}/node-v${NODE_DIST_VERSION}-linux-x64.tar.gz"
          tar -xzf node.tar.gz -C build/stage/node --strip-components=1
          test -x build/stage/node/bin/node
      - name: Pack tar.gz (install.sh at archive top level)
        run: |
          set -euo pipefail
          tar -czf "openwebcode-${VERSION}-linux-x64.tar.gz" \
            -C build/stage . \
            -C "$GITHUB_WORKSPACE/packaging" install.sh
      - name: Upload tar.gz to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          files: openwebcode-${{ env.VERSION }}-linux-x64.tar.gz
