name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（形如 vX.Y.Z；tag 不存在时基于当前提交创建）"
        required: true
        type: string
      bootstrap_benchmark_baseline:
        description: "仅首次建立性能基线时显式允许无上一版本基线"
        required: false
        default: false
        type: boolean
      skip_performance_tests:
        description: "跳过性能基准（仅手动发布；不生成或发布基准 JSON）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # bundled Node 24 运行时的具体版本（nodejs.org 发行包），升级时只改这个常量
  NODE_DIST_VERSION: "24.18.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches repo versions
        # tag 推送与 workflow_dispatch（inputs.tag）都执行校验；发布必须四方一致，尽早失败
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # 预发布 tag（如 v1.0.0-beta.1）：package.json 存完整版本号，CMake
          # project(VERSION) 只能存数值基版本，故 core 侧与 BASE_VERSION 比对
          BASE_VERSION="${VERSION%%-*}"
          PKG_VERSION="$(node -p "require('./server/package.json').version")"
          WEB_VERSION="$(node -p "require('./web/package.json').version")"
          CORE_VERSION="$(sed -n 's/^project(openwebcode_core VERSION \([0-9][0-9.]*\).*/\1/p' core/CMakeLists.txt | head -n 1)"
          if [ -z "$PKG_VERSION" ] || [ -z "$WEB_VERSION" ] || [ -z "$CORE_VERSION" ]; then
            echo "::error::无法解析仓库内版本号：server/package.json='$PKG_VERSION' web/package.json='$WEB_VERSION' CMakeLists.txt='$CORE_VERSION'"
            exit 1
          fi
          if [ "$VERSION" != "$PKG_VERSION" ] || [ "$VERSION" != "$WEB_VERSION" ] || [ "$BASE_VERSION" != "$CORE_VERSION" ]; then
            echo "::error::tag 版本 ($VERSION，基版本 $BASE_VERSION) 与 server/package.json ($PKG_VERSION)、web/package.json ($WEB_VERSION)、core/CMakeLists.txt ($CORE_VERSION) 不一致，请先对齐再发版"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BASE_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"
      - name: Build server
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm ci
          npm run build
      - name: Build core (Debug, for tests)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S core -B build-debug -A x64
          cmake --build build-debug --config Debug --parallel
      - name: Test core
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-debug -C Debug --output-on-failure --timeout 60
      - name: Test server
        shell: bash
        env:
          OWC_CORE_PATH: ${{ runner.workspace }}/openwebcode/build-debug/Debug/owc-exec.exe
        run: |
          set -euo pipefail
          cd server
          npm test
      - name: Build web
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
      - name: Test web
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm test
      - name: Prune dev deps for staging
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm prune --omit=dev
          # @fastify/send publishes test fixtures, including a snowman-named
          # directory that WiX v3's code page 1252 cannot represent. Tests are
          # not used at runtime, so omit them from the distributable tree.
          rm -rf node_modules/@fastify/send/test
      - name: Build core (Release)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S core -B build -A x64 -DCPACK_PACKAGE_VERSION="$BASE_VERSION" -DCPACK_FULL_VERSION="$VERSION"
          cmake --build build --config Release --target owc-exec
      - name: Stage runtime into build/stage
        shell: bash
        run: |
          set -euo pipefail
          # staging 契约见 core/CMakeLists.txt 末尾注释
          rm -rf build/stage
          mkdir -p build/stage/bin build/stage/server build/stage/web build/stage/node
          cp build/Release/owc-exec.exe build/stage/bin/
          cp -r server/dist server/package.json server/node_modules server/assets build/stage/server/
          cp -r web/dist build/stage/web/
          curl -fsSLo node.zip "https://nodejs.org/dist/v${NODE_DIST_VERSION}/node-v${NODE_DIST_VERSION}-win-x64.zip"
          # 对照官方 SHASUMS256.txt 校验下载的 bundled Node（防截断/镜像损坏），不硬编码哈希
          curl -fsSLo SHASUMS256.txt "https://nodejs.org/dist/v${NODE_DIST_VERSION}/SHASUMS256.txt"
          EXPECTED_SHA="$(grep "node-v${NODE_DIST_VERSION}-win-x64\.zip\$" SHASUMS256.txt | awk '{print $1}')"
          test -n "$EXPECTED_SHA"
          ACTUAL_SHA="$(certutil -hashfile node.zip SHA256 | sed -n '2p' | tr -d ' \r' | tr 'A-F' 'a-f')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::bundled Node zip SHA-256 校验失败：期望 $EXPECTED_SHA，实际 $ACTUAL_SHA"
            exit 1
          fi
          # Git for Windows 的 tar 在部分 runner 镜像中只支持 tar 流，不能解 zip；
          # 使用系统 PowerShell 的 Expand-Archive，避免把 ZIP 误判为 tar。
          pwsh -NoLogo -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'node.zip' -DestinationPath '.' -Force"
          cp "node-v${NODE_DIST_VERSION}-win-x64/node.exe" build/stage/node/
          test -f build/stage/node/node.exe
          # .cmd 需要 CRLF：先去已有 \r 再统一加（与 checkout 的 EOL 配置无关）
          sed 's/\r$//' packaging/owc.cmd | sed 's/$/\r/' > build/stage/bin/owc.cmd
          sed 's/\r$//' packaging/owc-launch.cmd | sed 's/$/\r/' > build/stage/bin/owc-launch.cmd
          test -f build/stage/bin/owc-exec.exe
      - name: Ensure WiX toolset
        shell: bash
        run: |
          if command -v candle.exe >/dev/null 2>&1 || [ -n "${WIX:-}" ]; then
            echo "WiX already available"
            exit 0
          fi
          choco install wixtoolset --version 3.14.1.20250415 --no-progress
          echo 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"
      - name: Pack MSI (CPack WIX)
        shell: bash
        run: |
          set -euo pipefail
          if ! cpack --config build/CPackConfig.cmake -G WIX -C Release; then
            find _CPack_Packages -name wix.log -print -exec cat '{}' \; || true
            exit 1
          fi
      - name: Verify MSI shell integration options
        shell: pwsh
        run: |
          ./packaging/verify-wix-options.ps1 -MsiPath "openwebcode-${env:VERSION}-windows-x64.msi"
      - name: Smoke-test Windows MSI installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "openwebcode-${env:VERSION}-windows-x64.msi").Path
          $installDir = Join-Path $env:ProgramFiles 'openwebcode'
          $proc = $null
          try {
            # msiexec /quiet 需要管理员；windows runner 默认即是
            $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart', '/L*v', 'msi-install.log'
            if ($install.ExitCode -ne 0) {
              Get-Content msi-install.log -ErrorAction SilentlyContinue
              throw "msiexec install failed with exit code $($install.ExitCode)"
            }
            $owc = Join-Path $installDir 'bin\owc.cmd'
            if (-not (Test-Path $owc)) { throw "launcher missing after install: $owc" }
            $env:OWC_PORT = '39032'
            $env:OWC_DATA_DIR = Join-Path $env:RUNNER_TEMP 'owc-smoke-data'
            $proc = Start-Process -PassThru -FilePath 'cmd.exe' -ArgumentList '/c', "`"$owc`"" `
              -RedirectStandardOutput 'owc-smoke.log' -RedirectStandardError 'owc-smoke.err'
            $ready = $false
            foreach ($i in 1..30) {
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:39032/api/health' -TimeoutSec 2
                if ($response.status -eq 'ok') { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) {
                Get-Content owc-smoke.log, owc-smoke.err -ErrorAction SilentlyContinue
                throw 'server exited before the health check passed'
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Get-Content owc-smoke.log, owc-smoke.err -ErrorAction SilentlyContinue
              throw 'health check did not pass within 30s'
            }
          } finally {
            # 结束进程树（cmd.exe 下的 node.exe），再卸载，保证 job 结束即清理
            if ($proc -and -not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }
            $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/quiet', '/norestart'
            if ($uninstall.ExitCode -ne 0) { Write-Warning "msiexec uninstall returned $($uninstall.ExitCode)" }
          }
      - name: Upload MSI for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-msi
          if-no-files-found: error
          path: openwebcode-${{ env.VERSION }}-windows-x64.msi

  linux:
    strategy:
      fail-fast: false
      matrix:
        # x64/arm64 原生构建+完整测试+冒烟；loongarch64 在 x64 runner 交叉编译（无 runner，
        # 跳过 ctest/server 测试与冒烟），包内不含 node/（install.sh 自动降级 --use-system-node）
        arch: [x64, arm64, loongarch64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches repo versions
        # tag 推送与 workflow_dispatch（inputs.tag）都执行校验；发布必须四方一致，尽早失败
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # 预发布 tag（如 v1.0.0-beta.1）：package.json 存完整版本号，CMake
          # project(VERSION) 只能存数值基版本，故 core 侧与 BASE_VERSION 比对
          BASE_VERSION="${VERSION%%-*}"
          PKG_VERSION="$(node -p "require('./server/package.json').version")"
          WEB_VERSION="$(node -p "require('./web/package.json').version")"
          CORE_VERSION="$(sed -n 's/^project(openwebcode_core VERSION \([0-9][0-9.]*\).*/\1/p' core/CMakeLists.txt | head -n 1)"
          if [ -z "$PKG_VERSION" ] || [ -z "$WEB_VERSION" ] || [ -z "$CORE_VERSION" ]; then
            echo "::error::无法解析仓库内版本号：server/package.json='$PKG_VERSION' web/package.json='$WEB_VERSION' CMakeLists.txt='$CORE_VERSION'"
            exit 1
          fi
          if [ "$VERSION" != "$PKG_VERSION" ] || [ "$VERSION" != "$WEB_VERSION" ] || [ "$BASE_VERSION" != "$CORE_VERSION" ]; then
            echo "::error::tag 版本 ($VERSION，基版本 $BASE_VERSION) 与 server/package.json ($PKG_VERSION)、web/package.json ($WEB_VERSION)、core/CMakeLists.txt ($CORE_VERSION) 不一致，请先对齐再发版"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BASE_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"
      - name: Build server
        run: |
          set -euo pipefail
          cd server
          npm ci
          npm run build
      - name: Build core (Debug, for tests)
        if: ${{ matrix.arch != 'loongarch64' }}
        run: |
          set -euo pipefail
          cmake -S core -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug --parallel
      - name: Test core
        if: ${{ matrix.arch != 'loongarch64' }}
        run: |
          set -euo pipefail
          ctest --test-dir build-debug --output-on-failure --timeout 60
      - name: Test server
        if: ${{ matrix.arch != 'loongarch64' }}
        env:
          OWC_CORE_PATH: ${{ runner.workspace }}/openwebcode/build-debug/owc-exec
        run: |
          set -euo pipefail
          cd server
          npm test
      - name: Build web
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
      - name: Test web
        run: |
          set -euo pipefail
          cd web
          npm test
      - name: Prune dev deps for staging
        run: |
          set -euo pipefail
          cd server
          npm prune --omit=dev
          # Keep both platform bundles on the same production dependency tree.
          rm -rf node_modules/@fastify/send/test
      - name: Install LoongArch64 cross toolchain
        if: ${{ matrix.arch == 'loongarch64' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14-loongarch64-linux-gnu
      - name: Build core (Release)
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "loongarch64" ]; then
            cmake -S core -B build --toolchain "$PWD/core/toolchains/loongarch64-linux-gnu.cmake" \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
              -DCPACK_PACKAGE_VERSION="$BASE_VERSION" -DCPACK_FULL_VERSION="$VERSION"
          else
            cmake -S core -B build -DCMAKE_BUILD_TYPE=Release -DCPACK_PACKAGE_VERSION="$BASE_VERSION" -DCPACK_FULL_VERSION="$VERSION"
          fi
          cmake --build build --target owc-exec --parallel
      - name: Verify cross-built binary architecture
        if: ${{ matrix.arch == 'loongarch64' }}
        run: |
          set -euo pipefail
          # 防 toolchain 静默回落主机编译器：交叉产物必须是目标架构 ELF
          file build/owc-exec | grep -q 'loongarch64' || { echo "build/owc-exec is not loongarch64 ELF"; file build/owc-exec; exit 1; }
      - name: Stage runtime into build/stage
        run: |
          set -euo pipefail
          # staging 契约见 core/CMakeLists.txt 末尾注释
          rm -rf build/stage
          mkdir -p build/stage/bin build/stage/server build/stage/web
          cp build/owc-exec build/stage/bin/
          cp -r server/dist server/package.json server/node_modules server/assets build/stage/server/
          cp -r web/dist build/stage/web/
          # loongarch64：nodejs.org 无官方包，不内置 node/（install.sh 自动降级 --use-system-node）
          if [ "${{ matrix.arch }}" != "loongarch64" ]; then
            mkdir -p build/stage/node
            NODE_ARCHIVE="node-v${NODE_DIST_VERSION}-linux-${{ matrix.arch }}.tar.gz"
            curl -fsSLo "$NODE_ARCHIVE" "https://nodejs.org/dist/v${NODE_DIST_VERSION}/${NODE_ARCHIVE}"
            # 对照官方 SHASUMS256.txt 校验下载的 bundled Node（防截断/镜像损坏），不硬编码哈希
            curl -fsSLo SHASUMS256.txt "https://nodejs.org/dist/v${NODE_DIST_VERSION}/SHASUMS256.txt"
            grep -E "^[0-9a-f]{64}  ${NODE_ARCHIVE}\$" SHASUMS256.txt | sha256sum --check
            tar -xzf "$NODE_ARCHIVE" -C build/stage/node --strip-components=1
            test -x build/stage/node/bin/node
          fi
      - name: Pack tar.gz (install.sh at archive top level)
        run: |
          set -euo pipefail
          tar -czf "openwebcode-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            -C build/stage . \
            -C "$GITHUB_WORKSPACE/packaging" install.sh uninstall.sh
      - name: Smoke-test Linux tar.gz installation
        if: ${{ matrix.arch != 'loongarch64' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="openwebcode-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          work="$(mktemp -d)"
          pid=""
          cleanup() {
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          mkdir "$work/pkg"
          tar -xzf "$archive" -C "$work/pkg"
          test -x "$work/pkg/install.sh"
          test -f "$work/pkg/uninstall.sh"
          "$work/pkg/install.sh" --yes --prefix "$work/prefix"

          test -x "$work/prefix/bin/owc"
          test -x "$work/prefix/bin/owc-uninstall"
          test -x "$work/prefix/lib/openwebcode/bin/owc-exec"
          test -x "$work/prefix/lib/openwebcode/node/bin/node"
          test -f "$work/prefix/lib/openwebcode/server/dist/index.js"
          test -f "$work/prefix/lib/openwebcode/web/dist/index.html"

          OWC_HOST=127.0.0.1 \
          OWC_PORT=39031 \
          OWC_DATA_DIR="$work/data" \
            "$work/prefix/bin/owc" >"$work/owc.log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 30); do
            response=""
            if response="$(curl -fsS http://127.0.0.1:39031/api/health)"; then
              if [ "$response" = '{"status":"ok"}' ]; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$work/owc.log"
              exit 1
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { cat "$work/owc.log"; exit 1; }
      - name: Upload tar.gz for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-tarball-${{ matrix.arch }}
          if-no-files-found: error
          path: openwebcode-${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: [windows, linux, benchmark]
    if: >-
      ${{
        always() &&
        needs.windows.result == 'success' &&
        needs.linux.result == 'success' &&
        (
          needs.benchmark.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.skip_performance_tests == true &&
            needs.benchmark.result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: release-windows-msi
          path: release-assets
      - name: Download Linux tar.gz (all arches)
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-tarball-*
          path: release-assets
          merge-multiple: true
      - name: Download benchmark baselines
        if: ${{ needs.benchmark.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: bench-results-${{ env.VERSION }}
          path: release-assets/benchmarks
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/openwebcode-${VERSION}-windows-x64.msi"
          for arch in x64 arm64 loongarch64; do
            test -f "release-assets/openwebcode-${VERSION}-linux-${arch}.tar.gz"
          done
      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum "openwebcode-${VERSION}-windows-x64.msi" \
              "openwebcode-${VERSION}-linux-x64.tar.gz" \
              "openwebcode-${VERSION}-linux-arm64.tar.gz" \
              "openwebcode-${VERSION}-linux-loongarch64.tar.gz" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          # 取 "## [$VERSION] - ..." 标题之后到下一个 "## [" 之间的正文；缺失或为空则阻断发布
          # 用 index/substr 而非正则，兼容 mawk（ubuntu 默认 awk）
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found=1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md 中缺少 [${VERSION}] 的发布说明段落（或为空），请先补 CHANGELOG 再发版"
            exit 1
          fi
      - name: Publish artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          # 版本号带预发布后缀（如 1.0.0-beta.1）时标记为 Pre-release
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          # On workflow_dispatch, a new tag must point at the commit that
          # started this run instead of GitHub's default branch implicitly.
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/openwebcode-${{ env.VERSION }}-windows-x64.msi
            release-assets/openwebcode-${{ env.VERSION }}-linux-x64.tar.gz
            release-assets/openwebcode-${{ env.VERSION }}-linux-arm64.tar.gz
            release-assets/openwebcode-${{ env.VERSION }}-linux-loongarch64.tar.gz
            release-assets/SHA256SUMS.txt
            packaging/install-online.sh
            ${{ needs.benchmark.result == 'success' && 'release-assets/benchmarks/bench-results-*.json' || '' }}

  benchmark:
    name: Performance Benchmarks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_performance_tests != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd server && npm ci
          cd ../web && npm ci
      - name: Build web
        shell: bash
        run: |
          set -euo pipefail
          cd web && npm run build
      - name: Generate benchmark datasets
        shell: bash
        run: |
          set -euo pipefail
          server/node_modules/.bin/tsx scripts/bench/generate-dataset.mjs
      - name: Run Node benchmarks
        shell: bash
        run: |
          set -euo pipefail
          TSX=server/node_modules/.bin/tsx
          $TSX scripts/bench/bench-long-history.mjs
          $TSX scripts/bench/bench-long-stream.mjs
          $TSX scripts/bench/bench-slow-client.mjs
          $TSX scripts/bench/bench-multi-tool.mjs
          $TSX scripts/bench/bench-context-build.mjs
          $TSX scripts/bench/bench-index-100k.mjs
      - name: Install Playwright Chromium
        shell: bash
        run: server/node_modules/.bin/playwright install chromium --with-deps
      - name: Run browser rendering benchmark
        shell: bash
        run: |
          set -euo pipefail
          server/node_modules/.bin/tsx scripts/bench/browser/bench-browser-render.mjs
      - name: Compare with previous release baseline
        shell: bash
        run: |
          set -euo pipefail
          TSX=server/node_modules/.bin/tsx
          BOOTSTRAP="${{ inputs.bootstrap_benchmark_baseline || 'false' }}"
          EXPECTED=(long-history long-stream multi-tool slow-client context-build index-100k browser-render)
          # 排除当前目标 tag 后选择最新 release；兼容 tag push 与 workflow_dispatch。
          CURRENT_TAG="${{ inputs.tag || github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -Fvx "$CURRENT_TAG" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "::notice::已显式启用首次性能基线 bootstrap"
              exit 0
            fi
            echo "::warning::无上一 release 基线，跳过性能对比（不阻断发布）"
            exit 0
          fi
          echo "对比基线：$PREV_TAG"
          mkdir -p baseline
          # 基准 JSON 是上一 GitHub Release 的正式资产。
          if ! gh release download "$PREV_TAG" --pattern 'bench-results-*.json' --dir baseline; then
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "::notice::上一 release 无可用基准资产；已显式启用 bootstrap"
              exit 0
            fi
            echo "::warning::无法下载上一 release ($PREV_TAG) 的基准结果，跳过性能对比（不阻断发布）"
            exit 0
          fi
          MISSING=0
          REGRESSION=0
          for scenario in "${EXPECTED[@]}"; do
            result="scripts/bench/results/${scenario}.json"
            base="baseline/bench-results-${scenario}.json"
            if [ ! -f "$result" ]; then
              echo "::error::当前构建缺少基准场景结果：$scenario"
              MISSING=1
              continue
            fi
            if [ ! -f "$base" ]; then
              echo "::warning::上一 release 缺少基准场景：$scenario，跳过该场景对比"
              continue
            fi
            $TSX scripts/bench/compare.mjs "$base" "$result" || REGRESSION=1
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::基准运行本身不完整"
            exit 1
          fi
          if [ "$REGRESSION" -eq 1 ]; then
            echo "::warning::性能回归超过 15% 阈值（已降级为警告，不阻断发布）"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare benchmark release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-release
          for result in scripts/bench/results/*.json; do
            cp "$result" "benchmark-release/bench-results-$(basename "$result")"
          done
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ env.VERSION }}
          if-no-files-found: error
          path: benchmark-release/bench-results-*.json
