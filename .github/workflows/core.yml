name: core

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # arm64 原生构建防回归（release.yml 同架构出包）
  linux-arm64:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 龙芯（LoongArch64）无可用 runner：x64 上交叉编译，编译通过即门禁（不跑 ctest）
  loongarch64-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14-loongarch64-linux-gnu
      - name: Configure (cross)
        run: cmake -S core -B build-loong --toolchain "$PWD/core/toolchains/loongarch64-linux-gnu.cmake" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build (cross)
        run: cmake --build build-loong --parallel
      - name: Verify cross-built binary architecture
        run: |
          set -euo pipefail
          # 防 toolchain 静默回落主机编译器：交叉产物必须是目标架构 ELF
          file build-loong/owc-exec | grep -qi 'loongarch' || { echo "build-loong/owc-exec is not loongarch64 ELF"; file build-loong/owc-exec; exit 1; }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build -A x64
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (compile_commands)
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # 仅报告：不加 --warnings-as-errors，存量告警逐步收敛
      - name: Run clang-tidy (report only)
        run: clang-tidy -p build core/src/*.c

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan)
        env:
          CC: gcc
        run: cmake -S core -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test (ASan)
        run: ctest --test-dir build-asan --output-on-failure